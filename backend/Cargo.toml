[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "mission_control"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse"] }
